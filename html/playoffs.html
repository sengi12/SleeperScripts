<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Most Division Wins Since Realignment</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --ink:#1f1f1f; --afc:#d50a0a; --nfc:#013369; --gold:#e6b422 }
  * { box-sizing:border-box }
  body { margin:0; background:#e9e9e9; font-family:Barlow, system-ui, sans-serif; color:#222 }
  .toolbar { display:flex; gap:10px; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #ccc; position:sticky; top:0; z-index:5 }
  .toolbar button { font:inherit; font-weight:700; padding:6px 12px; border:1px solid #333; background:#fff; border-radius:3px; cursor:pointer }
  .toolbar button.primary { background:#1f1f1f; color:#fff }
  .toolbar .spacer { flex:1 }
  #status { font-size:12px; color:#555 }
  .stage { padding:24px; display:flex; justify-content:center }

  #chart { background:var(--ink); padding:18px 18px 22px; width:980px; box-shadow:0 0 0 1px #555; position:relative }
  .chart-title { font-family:'Bebas Neue', Impact, sans-serif; color:#e6e6e6; text-align:center; line-height:1; margin:4px 0 4px; font-size:60px; letter-spacing:1px }
  .chart-sub { font-family:'Bebas Neue', Impact, sans-serif; color:#aaa; text-align:center; font-size:30px; letter-spacing:1px; margin-bottom:10px }
  .legend { position:absolute; left:18px; top:18px; border:2px solid #777; padding:6px 10px; font-size:11px; color:#ddd; line-height:1.9 }
  .legend b { font-family:'Bebas Neue', Impact, sans-serif; font-size:15px; letter-spacing:1px; display:block; text-decoration:underline; text-align:center; line-height:1.2; margin-bottom:2px }
  .legend .lg { display:flex; align-items:center; gap:4px; height:26px }
  .legend .lg img { height:20px; width:auto } .legend .lg img.tall { height:24px; margin:0 6px 0 4px }
  .legend .lg span { margin-left:6px; font-family:'Bebas Neue', Impact, sans-serif; font-size:13px; letter-spacing:1px }

  .head { display:grid; grid-template-columns:62px 160px 200px 80px 110px 80px 1fr; column-gap:0; font-family:'Bebas Neue', Impact, sans-serif; font-size:14px; letter-spacing:1px; color:#ddd; text-align:center; margin:0 0 4px }
  .head span { line-height:1.05; align-self:end; padding:0 4px }
  .head span:first-child, .head span:nth-child(2), .head span:nth-child(3) { visibility:hidden }
  #rows { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px }
  .row { display:grid; grid-template-columns:62px 160px 200px 80px 110px 80px 1fr; height:60px; background:#fff }
  .rank { font-family:'Bebas Neue', Impact, sans-serif; font-size:40px; line-height:60px; text-align:center; color:#111; background:#fff; border-right:3px solid var(--ink) }
  .logo { display:flex; align-items:center; justify-content:center; overflow:hidden }
  .logo img { width:100%; height:auto; flex:none; transform:translateY(var(--y,0px)) scale(1.06);
    filter:drop-shadow(1px 0 0 rgba(255,255,255,.75)) drop-shadow(-1px 0 0 rgba(255,255,255,.75)) drop-shadow(0 1px 0 rgba(255,255,255,.75)) drop-shadow(0 -1px 0 rgba(255,255,255,.75)) }
  .row[data-light] .logo img { filter:drop-shadow(1px 0 0 rgba(0,0,0,.6)) drop-shadow(-1px 0 0 rgba(0,0,0,.6)) drop-shadow(0 1px 0 rgba(0,0,0,.6)) drop-shadow(0 -1px 0 rgba(0,0,0,.6)) }
  .name { display:flex; align-items:center; justify-content:center; padding:0 6px }
  .name span { font-size:13px; font-weight:500; letter-spacing:.5px; text-transform:uppercase; padding:9px 0; width:100%; text-align:center; border-radius:2px; white-space:nowrap }
  .name b { font-weight:700 }
  .num { font-family:'Bebas Neue', Impact, sans-serif; font-size:38px; line-height:60px; text-align:center; color:#fff; letter-spacing:1px }
  .results { background:#2b2b2b; display:flex; align-items:center; justify-content:center; gap:14px; padding:0 10px; font-family:'Bebas Neue', Impact, sans-serif; font-size:24px; color:#fff }
  .chip { display:inline-flex; align-items:center; gap:4px; white-space:nowrap }
  .chip .sb { font-size:24px; line-height:1 }
  .chip .conf { font-family:'Bebas Neue', Impact, sans-serif; font-size:13px; letter-spacing:1px; padding:3px 5px 2px; border-radius:2px; color:#fff; line-height:1 }
  .chip .conf.AFC { background:var(--afc) } .chip .conf.NFC { background:var(--nfc) }
  .chip .conf.champ { box-shadow:0 0 0 2px var(--gold) }
  .chip .conf.champ::before { content:'★ '; color:var(--gold) }
  .chip .n { font-size:24px }
  .chip .icon { height:30px; width:auto }
  .chip .icon.ru { height:20px }
  .chip .icon.champ { height:30px }
</style>
</head>

// ---------- live data from nflverse/nfldata (standings for division titles, games for playoffs) ----------
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
async function loadLive(){
  const base = 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/';
  const [st, gm] = await Promise.all([fetch(base + 'standings.csv').then(r => r.text()), fetch(base + 'games.csv').then(r => r.text())]);
  const standings = parseCsv(st), games = parseCsv(gm).filter(g => +g.season >= 2002 && g.result !== '');
  const last = Math.max(...games.filter(g => g.game_type === 'SB').map(g => +g.season));   // last completed season
  const norm = t => FRANCHISE[t] || t;
  const d = {}; for (const k of Object.keys(TEAMS)) d[k] = { div:[], pw:0, pg:0, ccWon:[], ccLost:[], sb:[] };
  for (const s of standings) { const t = norm(s.team); if (+s.season >= 2002 && +s.season <= last && s.div_rank === '1' && d[t]) d[t].div.push(+s.season); }
  for (const g of games) {
    if (g.game_type === 'REG' || +g.season > last) continue;
    const home = norm(g.home_team), away = norm(g.away_team), hs = +g.home_score, as = +g.away_score;
    for (const [t, won] of [[home, hs > as], [away, as > hs]]) {
      if (!d[t]) continue;
      d[t].pg++; if (won) d[t].pw++;
      if (g.game_type === 'CON') (won ? d[t].ccWon : d[t].ccLost).push(+g.season);
      if (g.game_type === 'SB' && won) d[t].sb.push(+g.season);
    }
  }
  DATA = d; LAST_SEASON = last;
}

// ---------- render ----------
function chip(kind, conf, n, years){
  if (!n) return '';
  const title = years.slice().sort().join(', ');
  const img = ICONS[kind === 'sb' ? 'sb' : `${conf}_${kind}`];
  if (img) return `<span class="chip" title="${title}"><img class="icon ${kind}" src="${img}" alt=""><span class="n">×${n}</span></span>`;
  if (kind === 'sb') return `<span class="chip" title="${title}"><span class="sb">🏆</span><span class="n">×${n}</span></span>`;
  return `<span class="chip" title="${title}"><span class="conf ${conf} ${kind === 'champ' ? 'champ' : ''}">${conf}</span><span class="n">×${n}</span></span>`;
}
function render(){
  document.getElementById('sub').textContent = `*SINCE REALIGNMENT (2002–${LAST_SEASON})*`;
  const list = Object.keys(TEAMS).map(k => ({ k, ...DATA[k] }));
  list.sort((a, b) => b.div.length - a.div.length || b.sb.length - a.sb.length || b.pw - a.pw || b.pg - a.pg);
  let rank = 0;
  list.forEach((t, i) => { if (i === 0 || t.div.length !== list[i-1].div.length) rank = i + 1; t.rank = rank;
    t.tied = list.filter(o => o.div.length === t.div.length).length > 1; });
  document.getElementById('rows').innerHTML = list.map(t => {
    const [city, name, p1, p2, , conf] = TEAMS[t.k];
    const pct = t.pg ? Math.round(100 * t.pw / t.pg) : 0;
    const sbLosses = t.ccWon.filter(y => !t.sb.includes(y));     // won conference but not the Super Bowl
    return `<li class="row" data-abbr="${t.k}" ${LIGHT_PANEL.has(t.k) ? 'data-light' : ''} style="background:${p1}">
      <div class="rank">${t.tied ? 'T-' : ''}${t.rank}</div>
      <div class="logo"><img src="${logoUrl(t.k)}" crossorigin="anonymous" alt="" onerror="if(!this.dataset.r){this.dataset.r=1;this.removeAttribute('crossorigin');this.src=this.src}" style="--y:${LOGO_Y[t.k]||0}px"></div>
      <div class="name"><span style="background:${p2};color:${textColor(p2)}">${city} <b>${name}</b></span></div>
      <div class="num" title="${t.div.join(', ')}">${t.div.length}</div>
      <div class="num">${t.pw}–${t.pg}</div>
      <div class="num">${pct}%</div>
      <div class="results">${chip('sb', conf, t.sb.length, t.sb)}${chip('champ', conf, sbLosses.length, sbLosses)}${chip('ru', conf, t.ccLost.length, t.ccLost)}</div>
    </li>`;
  }).join('');
}

const setStatus = t => document.getElementById('status').textContent = t;
document.getElementById('refresh').onclick = async () => {
  setStatus('Loading nflverse data…');
  try { await loadLive(); render(); setStatus(`Live data through the ${LAST_SEASON} season.`); }
  catch (e) { render(); setStatus('Could not reach nflverse — showing the saved snapshot.'); }
};
document.getElementById('exportPng').onclick = async () => {
  setStatus('Rendering PNG…');
  try {
    const canvas = await html2canvas(document.getElementById('chart'), { scale: 2, useCORS: true, backgroundColor: '#1f1f1f' });
    const a = Object.assign(document.createElement('a'), { href: canvas.toDataURL('image/png'), download: `division-wins-2002-${LAST_SEASON}.png` }); a.click();
    setStatus('PNG downloaded.');
  } catch { setStatus('Export blocked by logo hosting — take a screenshot of the chart instead.'); }
};
document.getElementById('logoKey').innerHTML = Object.keys(TEAMS).map(k => `<option value="${k}">${TEAMS[k][0]} ${TEAMS[k][1]}</option>`).join('');
// ---- replace a logo, then "Save page" writes it into this file ----
const fileToDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
document.getElementById('logoFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const key = document.getElementById('logoKey').value;
  LOGO_OVERRIDE[key] = await fileToDataUrl(f); render(); e.target.value = '';
  setStatus(`Logo set for ${key}. Click "Save page" to keep it.`);
};
document.getElementById('savePage').onclick = () => {
  const html = ('<!doctype html>\n' + document.documentElement.outerHTML)
    .replace(/const LOGO_OVERRIDE = \{[\s\S]*?\};/, 'const LOGO_OVERRIDE = ' + JSON.stringify(LOGO_OVERRIDE) + ';');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([html], { type:'text/html' })), download: 'division-wins.html' }); a.click();
  setStatus('Saved a copy of this page with the new logo inside. Replace the old file with it.');
};
render();
document.getElementById('refresh').click();
</script>
